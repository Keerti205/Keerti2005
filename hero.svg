<rect x="36" y="34" width="1128" height="432" rx="24" fill="none" stroke="url(#h-grad)" stroke-opacity=".55"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect x="72" y="70" width="190" height="34" rx="17" fill="#22d3ee" fill-opacity=".10" stroke="#22d3ee" stroke-opacity=".45"/>
  <circle cx="94" cy="87" r="5" fill="#22d3ee"><animate attributeName="opacity" values="1;.25;1" dur="1.2s" repeatCount="indefinite"/></circle>
