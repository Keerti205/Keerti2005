<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="Animated GitHub profile hero for Keerti">
<defs>
  <linearGradient id="h-grad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  <radialGradient id="h-glow"><stop stop-color="#a78bfa" stop-opacity=".35"/><stop offset="1" stop-color="#0d0e16" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <clipPath id="avatarClip"><circle cx="930" cy="245" r="132"/></clipPath>
</defs>
<rect width="1200" height="500" rx="28" fill="#0d0e16"/>
