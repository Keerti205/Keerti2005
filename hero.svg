  <text x="70" y="225" font-family="system-ui, sans-serif" font-weight="800" font-size="64" fill="url(#h-grad)">Keerti</text>
  <text x="74" y="264" font-size="19" fill="#94a3b8">CSE Student • Web Developer • AI Enthusiast</text>
