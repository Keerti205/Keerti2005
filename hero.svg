    <rect x="190" y="386" width="92" height="32" rx="16" fill="#111827" stroke="#22d3ee" stroke-opacity=".45"/><text x="209" y="407">React</text>
    <rect x="292" y="386" width="105" height="32" rx="16" fill="#111827" stroke="#a78bfa" stroke-opacity=".45"/><text x="311" y="407">Node.js</text>
    <rect x="407" y="386" width="70" height="32" rx="16" fill="#111827" stroke="#f472b6" stroke-opacity=".45"/><text x="425" y="407">AI</text>
  </g>
</g>
