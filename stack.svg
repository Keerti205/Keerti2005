<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Animated technology stack for Keerti">
<defs><linearGradient id="s" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="12"/></filter></defs>
<rect width="1200" height="520" rx="28" fill="#0d0e16"/><rect x="28" y="28" width="1144" height="464" rx="24" fill="none" stroke="url(#s)" stroke-opacity=".5"/>
<text x="62" y="78" font-family="system-ui" font-size="28" font-weight="700" fill="#fff">Tech Stack</text><text x="62" y="105" font-family="monospace" font-size="13" fill="#64748b">orbiting tools • glowing skill chips • always learning</text>
<circle cx="360" cy="275" r="160" fill="#a78bfa" opacity=".12" filter="url(#g)"/>
<g fill="none" stroke="url(#s)" opacity=".35"><ellipse cx="360" cy="275" rx="245" ry="95"/><ellipse cx="360" cy="275" rx="245" ry="95" transform="rotate(60 360 275)"/><ellipse cx="360" cy="275" rx="245" ry="95" transform="rotate(-60 360 275)"/></g>
<circle cx="360" cy="275" r="62" fill="#111827" stroke="#22d3ee" stroke-width="2"/><text x="360" y="269" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="800" fill="#fff">KEERTI</text><text x="360" y="292" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8">CSE × AI</text>
<g font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">
<g><circle cx="605" cy="275" r="26" fill="#111827" stroke="#22d3ee"/><text x="605" y="279" fill="#e2e8f0">JS</text><animateTransform attributeName="transform" type="rotate" from="0 360 275" to="360 360 275" dur="12s" repeatCount="indefinite"/></g>
<g><circle cx="115" cy="275" r="26" fill="#111827" stroke="#a78bfa"/><text x="115" y="279" fill="#e2e8f0">R</text><animateTransform attributeName="transform" type="rotate" from="180 360 275" to="540 360 275" dur="16s" repeatCount="indefinite"/></g>
<g><circle cx="360" cy="435" r="26" fill="#111827" stroke="#f472b6"/><text x="360" y="279" fill="#e2e8f0">AI</text><animateTransform attributeName="transform" type="rotate" from="270 360 275" to="630 360 275" dur="14s" repeatCount="indefinite"/></g></g>
<g transform="translate(700 130)" font-family="system-ui"><text x="0" y="0" font-size="16" fill="#94a3b8">FRONTEND</text><g transform="translate(0 18)"><rect width="105" height="38" rx="19" fill="#111827" stroke="#22d3ee"/><text x="52" y="25" text-anchor="middle" fill="#e2e8f0">HTML</text><rect x="115" width="90" height="38" rx="19" fill="#111827" stroke="#22d3ee"/><text x="160" y="25" text-anchor="middle" fill="#e2e8f0">CSS</text><rect x="215" width="120" height="38" rx="19" fill="#111827" stroke="#22d3ee"/><text x="275" y="25" text-anchor="middle" fill="#e2e8f0">JavaScript</text></g>
<text x="0" y="95" font-size="16" fill="#94a3b8">BACKEND</text><g transform="translate(0 113)"><rect width="115" height="38" rx="19" fill="#111827" stroke="#a78bfa"/><text x="57" y="25" text-anchor="middle" fill="#e2e8f0">Node.js</text><rect x="125" width="90" height="38" rx="19" fill="#111827" stroke="#a78bfa"/><text x="170" y="25" text-anchor="middle" fill="#e2e8f0">APIs</text></g>
<text x="0" y="190" font-size="16" fill="#94a3b8">AI + TOOLS</text><g transform="translate(0 208)"><rect width="90" height="38" rx="19" fill="#111827" stroke="#f472b6"/><text x="45" y="25" text-anchor="middle" fill="#e2e8f0">AI</text><rect x="100" width="90" height="38" rx="19" fill="#111827" stroke="#f472b6"/><text x="145" y="25" text-anchor="middle" fill="#e2e8f0">Git</text><rect x="200" width="110" height="38" rx="19" fill="#111827" stroke="#f472b6"/><text x="255" y="25" text-anchor="middle" fill="#e2e8f0">GitHub</text></g></g>
</svg>
